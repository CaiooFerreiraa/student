services:
  app:
    build: .
    container_name: student-app
    restart: unless-stopped
    expose:
      - "3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - .env
    networks:
      - proxy-dev

volumes:
  node_modules:
  
networks:
  proxy-dev:
    external: true